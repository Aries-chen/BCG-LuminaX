data:
  _name: wuji_dl.data.DefaultDataModule
  common:
    _name: data.ahi.AHIDataset
    #weighted_sampling: 'ah_event'
    memmap: True
    max_tokens: 1
    token_sec: 300
    stride_tokens: 1
    index: index/ahi/aux_feature_filtered_index.csv
    features:
      - head: bcg_raw
        input_channels: 1
        token_len: 150000
      - head: breath
        input_channels: 1
        token_len: 1200

      - head: heartbeat
        input_channels: 1
        token_len: 1200

      - head: body_movement
        input_channels: 1
        is_input: False
        token_len: 1200
        

      - head: ah_event
        input_channels: 1
        is_input: False
        token_len: 300
        is_attribute: True
  train:
    split: train
    shuffle: True
  val:
    split: val
  test:
    split: test