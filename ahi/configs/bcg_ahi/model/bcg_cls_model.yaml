task:
  model:
    _name: models.ahi.YOHOEncoder
    conv_high:
      conv_feature_layers: "[(512, 3, 1)] * 3 + [(512, 2, 1)] * 2" #
      conv_dim: 1
      in_dim: 256
    conv_low:
      conv_feature_layers: "[(512, 3, 1)] * 3 + [(512, 2, 1)] * 2" #
      conv_dim: 1
      in_dim: 10
    processor:
      type: "bcg"
      fft: 510
      hop: 250
    seq_len: 300
    final_dim: 1
    dropout_input: 0.1
    dropout_features: 0.1
    encoder_embed_dim: 512
    nhead: 4
    num_encoder_layers: 6
    dropout: 0.1

  criterion:
    _name: losses.event_cls.EventDetectionLoss
    #loss_weights: {"iou_loss" : 1, "binary_cross_entropy" : 1}
    loss_weights: { "head_loss" : 1, 'iou_loss' : 0}
    weight: [1.6,0.4] # 0.159, 0.841