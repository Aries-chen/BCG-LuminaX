task:
  model:
    _name: models.ahi_anchor.YOHOEncoder
    conv_feature_layers: "[(256, 3, 1)] * 3 + [(256, 2, 1)] * 2" #
    #conv_feature_layers: "[(512, 4, 2)] + [(512, 3, 2)] * 2 + [(512, 3, 3)] + [(512, 2, 2)] * 2"
    final_dim: 6
    dropout_input: 0.1
    dropout_features: 0.1
    encoder_embed_dim: 256
    feature_len: 256
    processor: "bcg"
    n_mels: 128
    n_fft: 256
    hop_length: 20
  criterion:
    _name: losses.event_detection.EventDetectionLoss
    loss_weights: {"iou_loss" : 1, "binary_cross_entropy" : 1, "margin_loss" : 1}
    event_num: 2
    #loss_weights: { "head_loss" : 1}
    #weight: [1.68, 0.32] # 0.159, 0.841